# The test suite on every push: no network, no model call, no secret needed.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mission-zero .
      - name: the test suite inside the image
        run: docker run --rm --entrypoint npm mission-zero test
      - name: the image starts and refuses cleanly without a key
        run: docker run --rm mission-zero src/check-key.js || test $? -eq 1
