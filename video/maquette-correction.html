<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><style>
/* Ambiance de la carte ARGUS (nuit, menthe, bleu), adoucie : peu de halo, le vert réservé aux titres et aux « OK ». */
:root { --bg:#0d1526; --fg:#e8edf7; --mut:#a9b4cc; --line:rgba(255,255,255,.16); --card:rgba(255,255,255,.05); --acc:#2ee6a0; --acc2:rgba(46,230,160,.72); --accf:rgba(46,230,160,.12); --blue:#2d55d4; --red:#ff6b61; --redf:rgba(180,35,24,.22); --amber:#ffd27a; --mint:#c9fff0; color-scheme: dark; }
body { background:var(--bg); color:var(--fg); font-family: "Segoe UI", system-ui, sans-serif; margin:0; padding-block:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1700px; margin: 0 auto; display:grid; gap:18px; }
h1 { font-size: 1.4rem; margin:0; } h1 small { display:block; font-weight:400; color:var(--mut); font-size:.95rem; margin-top:4px; }
.scene { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; display:grid; gap:8px; min-width:0; }
.scene header { display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between; }
.scene h2 { margin:0; font-size:1.1rem; } .scene .t { color:var(--acc2); font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; }
svg { width:100%; height:auto; display:block; font-family: "Segoe UI", system-ui, sans-serif; overflow:visible; }
.b { opacity:0; transform-box: fill-box; transform-origin: center; }
.b.on { animation: pop .8s cubic-bezier(.2,.8,.2,1) forwards; }
.b.focus .box { filter: drop-shadow(0 0 8px rgba(46,230,160,.35)); }
@keyframes pop { 0% { opacity:0; transform: scale(.86); } 55% { opacity:1; transform: scale(1.06); } 100% { opacity:1; transform: scale(1); } }
.box { fill:rgba(255,255,255,.05); stroke:var(--line); stroke-width:2; }
.box.gold { stroke:var(--acc2); stroke-width:2.5; fill:rgba(46,230,160,.06); }
.box.blue { stroke:rgba(45,85,212,.8); stroke-width:2.5; fill:rgba(45,85,212,.14); }
.box.ok { stroke:var(--acc2); fill:rgba(46,230,160,.07); } .box.red { stroke:rgba(255,107,97,.8); fill:var(--redf); } .box.amber { stroke:rgba(255,210,122,.8); fill:rgba(255,210,122,.08); }
.lbl { fill:var(--fg); font-size:26px; font-weight:600; } .lbl.m { font-size:21px; } .lbl.s { font-size:18px; font-weight:400; fill:var(--mut); } .lbl.xs { font-size:15px; font-weight:400; fill:var(--mut); }
.lbl.acc { fill:var(--acc); } .lbl.red { fill:var(--red); } .lbl.amber { fill:var(--amber); } .lbl.okt { fill:#bff5dd; }
.code { font-family: Consolas, "Courier New", monospace; font-size:15px; fill:var(--mut); } .code.add { fill:#8fe6c0; } .code.del { fill:#ff9d95; }
.tile { fill:rgba(255,255,255,.04); stroke:var(--line); stroke-width:1.5; } .leaf { fill:rgba(46,230,160,.28); }
.badge { fill:var(--redf); stroke:rgba(255,107,97,.85); stroke-width:2; } .badge-t { fill:#ffd2ce; font-size:18px; font-weight:600; }
.badge.ok { fill:var(--accf); stroke:var(--acc2); } .badge-t.ok { fill:#bff5dd; }
.pill { stroke-width:2; } .pill.ok { fill:var(--accf); stroke:var(--acc2); } .pill.ko { fill:var(--redf); stroke:rgba(255,107,97,.85); }
.hidden { display:none; }
/* Flèches : épaisses, arrondies, douces ; se dessinent avec un point qui court devant ; jamais de croisement. */
.arrow { stroke:var(--acc2); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; fill:none; stroke-dasharray:1; stroke-dashoffset:1; transition: stroke-dashoffset 1s linear; }
.arrow.red { stroke:rgba(255,107,97,.8); } .arrow.ghost { stroke:none; }
.a.on .arrow { stroke-dashoffset:0; } .a.drawn .arrow { marker-end:url(#mok); } .a.drawn .arrow.red { marker-end:url(#mred); } .a.drawn .arrow.ghost { marker-end:none; }
.runner { fill:#fff; filter: drop-shadow(0 0 6px rgba(46,230,160,.8)); opacity:0; } .runner.go { opacity:1; }
.ring { fill:rgba(255,255,255,.03); stroke:var(--mut); stroke-width:3; stroke-dasharray:7 9; transition: fill .5s, stroke .5s; }
.ring.lit { fill:var(--accf); stroke:var(--acc2); stroke-dasharray:none; } .ring.bad { fill:var(--redf); stroke:rgba(255,107,97,.85); stroke-dasharray:none; }
.mini { fill:rgba(255,255,255,.03); stroke:var(--mut); stroke-width:2; stroke-dasharray:4 5; }
.chip { fill:rgba(255,255,255,.05); stroke:var(--line); stroke-width:2; transition: fill .5s, stroke .5s; }
.chip.ok { fill:var(--accf); stroke:var(--acc2); } .chip.ko { fill:var(--redf); stroke:rgba(255,107,97,.85); } .chip.next { stroke:rgba(255,210,122,.7); fill:rgba(255,210,122,.06); }
.chip-t { font-size:15px; fill:var(--fg); }
.bar { display:flex; flex-wrap:wrap; gap:8px; } button { background:rgba(255,255,255,.06); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; } button:hover { border-color:var(--acc2); }
.caption { min-height:2.2em; font-size:1.15rem; } .caption b { color:var(--acc); }
/* Le film : un seul écran, quatre chapitres, une carte-titre avant chacun. */
.filmbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.filmbar .big { background:rgba(46,230,160,.14); border-color:var(--acc2); font-weight:600; }
.film .scene { display:none; } .film .scene.active { display:grid; } .film .scene header, .film .bar { display:none; }
.card { display:none; aspect-ratio: 16/9; max-height: 70vh; border:1px solid var(--line); border-radius:16px; background: radial-gradient(ellipse at 50% 40%, rgba(45,85,212,.25), transparent 60%), var(--bg); place-items:center; text-align:center; padding: 24px; }
.card.show { display:grid; }
.card .n { color:var(--acc); font-size: clamp(28px, 4vw, 56px); font-weight:700; letter-spacing:.06em; }
.card .h { color:var(--fg); font-size: clamp(30px, 5.2vw, 76px); font-weight:800; line-height:1.1; margin-top:12px; text-wrap: balance; max-width: 18ch; }
.card .s { color:var(--mut); font-size: clamp(16px, 1.8vw, 26px); margin-top:18px; }
.card.end .h { color:var(--acc); }

/* Le fil du film : sur chaque carte-titre, le point traverse l'écran, le trait le suit. Jamais de rupture. */
.card { position:relative; overflow:hidden; }
.card .trail { position:absolute; left:0; bottom:calc(12% + 5px); height:4px; width:0; background:var(--acc2); border-radius:2px; }
.card .dot { position:absolute; left:0; bottom:12%; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--acc); opacity:0; }
.card.show .trail { animation: grow 2.4s linear forwards; } .card.show .dot { animation: ride 2.4s linear forwards; }
.card.end .trail, .card.end .dot { display:none; }
@keyframes grow { from { width:0; } to { width:100%; } } @keyframes ride { 0% { left:0; opacity:1; } 99% { opacity:1; } 100% { left:calc(100% - 14px); opacity:0; } }
.arrow.orbit { stroke-width:6; } .runner.go { opacity:1; }
.zoom { animation: zoomin 1.3s cubic-bezier(.2,.8,.2,1) forwards; } .zoom .chip { fill:var(--accf); stroke:var(--acc); }
@keyframes zoomin { to { transform: scale(1.35); } }
#stars circle { pointer-events:none; }
#speed { fill:var(--acc); }
/* La carte de fin : le fil dessine le zéro, puis CRYPTOR.AGENCY et, dessous, MISSION ZERO. */
.card .sym { display:none; } .card.end .sym { display:block; width: min(30vh, 200px); margin: 0 auto 6px; }
.card.end .zero { fill:none; stroke:var(--acc); stroke-width:7; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; animation: drawzero 2.2s cubic-bezier(.4,0,.2,1) forwards; }
.card.end .core { fill:#fff; opacity:0; filter: drop-shadow(0 0 8px var(--acc)); animation: corein .5s 2.1s forwards; }
.card.end .n { color:var(--mut); font-size: clamp(16px, 1.8vw, 24px); font-weight:400; letter-spacing:.02em; opacity:0; animation: fadein .8s 2.4s forwards; }
.card.end .h { color:var(--fg); font-size: clamp(34px, 6vw, 88px); letter-spacing:.08em; opacity:0; animation: fadein .8s 2.6s forwards; max-width: none; }
.card.end .s { color:var(--acc); font-size: clamp(22px, 3vw, 44px); letter-spacing:.42em; font-weight:700; margin-top:8px; opacity:0; animation: fadein .8s 3.1s forwards; }
@keyframes drawzero { to { stroke-dashoffset:0; } } @keyframes corein { to { opacity:1; } } @keyframes fadein { to { opacity:1; } }
/* Enregistrement vidéo (?record=1) : rien que l'écran du film et sa légende, cadré pour 1280 × 720. */
.record body { padding:0; } .record h1, .record .filmbar { display:none; } .record .wrap { gap:6px; max-width:1280px; }
.record .scene { border:none; border-radius:0; padding:6px 10px 0; background:transparent; } .record .scene svg { max-height:640px; margin:0 auto; }
.record .caption { min-height:2em; font-size:1.05rem; text-align:center; padding:0 12px; } .record .card { max-height:none; aspect-ratio:auto; height:708px; border:none; border-radius:0; }
</style>
<style>
.film .scene { display:none; } .film .scene.active { display:grid; } .film .scene header { display:none; }
.field { fill:#fff; stroke:#999; stroke-width:1.5; } .field.gone { fill:none; stroke:var(--red); stroke-dasharray:5 4; }
/* Surbrillance au passage du point : une pulsation du contour, rien de plus. Forte quand on revalide. */
.ring.pulse { animation: ringpulse .6s ease-out; } .ring.pulse.strong { animation: ringpulse-strong 1.2s ease-out; }
.box.pulse { animation: ringpulse .6s ease-out; } .box.pulse.strong { animation: ringpulse-strong 1.2s ease-out; }
@keyframes ringpulse { 0% { stroke-width:3; filter:none; } 30% { stroke-width:7; filter:drop-shadow(0 0 10px rgba(46,230,160,.9)); } 100% { stroke-width:3; filter:none; } }
@keyframes ringpulse-strong { 0% { stroke-width:3; filter:none; } 25% { stroke-width:9; filter:drop-shadow(0 0 18px rgba(46,230,160,1)); } 100% { stroke-width:3; filter:drop-shadow(0 0 6px rgba(46,230,160,.6)); } }
/* L'alerte prise en compte : le rond rouge clignote. */
.chip.ko.blink, .lbl.red.blink { animation: blink .5s steps(2, start) 5; }
/* L'alerte : le contour du rond clignote en rouge vif, épais, avec un halo rouge. */
.ring.bad.blink { animation: alarm .5s ease-in-out 7; }
@keyframes alarm { 0%, 100% { stroke:rgba(255,107,97,.85); stroke-width:3; filter:none; } 50% { stroke:#ff3b30; stroke-width:11; filter:drop-shadow(0 0 16px rgba(255,59,48,1)); } }
.caption .r { color:var(--red); font-weight:700; }
@keyframes blink { to { opacity:.25; } }
.arrow.ghost { stroke:none; }
.rg { opacity:0; transition: opacity .35s, transform .5s cubic-bezier(.2,.8,.2,1); transform-box: view-box; } .rg.on { opacity:1; }
.rg.zoomx { transform: translate(var(--zx), var(--zy)) scale(3.4); }
.rg.zoomx .ring { fill:#0f2b2c; stroke-width:2; filter: drop-shadow(0 0 4px rgba(46,230,160,.9)); } .rg.zoomx .arrow { stroke-width:2; }
/* Un rond en alerte : le fil vert posé sur son contour s'efface, pour que le rouge se voie. */
.rg:has(.ring.bad) .arrow.split { opacity:0; }
/* Pendant le zoom, tout le reste de la boucle s'efface : rien sous le rond, rien autour. */
#loop > :not(.rg) { transition: opacity .4s; } #loop.zooming > .on:not(.zoomx), #loop.zooming > .a:not(.zoomx) { opacity:0 !important; }
.a.drawn .arrow.split { marker-end:none; }
.fan { opacity:0; transform: translate(var(--fx), var(--fy)) scale(.2); transform-box: view-box; transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .3s; }
.fan.on { opacity:1; transform: none; } .fan.zoom { transform: none; }
/* La boucle entière rétrécit jusqu'au point blanc. */
#loop { transform-box: view-box; transform-origin: 800px 420px; transition: transform 1s cubic-bezier(.4,0,.2,1), opacity 1s; }
#loop.shrink { transform: scale(0.01); opacity: 0; }
/* Le point blanc naît pendant le rétrécissement, au centre : aucun écran vide entre la boucle et le point. */
#dotc.on { animation-delay: .25s; }
/* La fin : le zéro tracé par le fil, la coupure au noir, le néon qui s'allume en dernier (un seul allumage, pas de boucle). */
.arrow.zero { stroke:var(--acc); stroke-width:7; }
body.black { background:#000; } body.black .scene { background:#000; } body.black .caption { visibility:hidden; }
.neon { fill:#39ffb0; filter: drop-shadow(0 0 6px #2ee6a0) drop-shadow(0 0 18px rgba(46,230,160,.8)); }
.b.on .neon { animation: neon 1.6s linear both; }
/* Le point écrit : chaque lettre se trace à son tour (contour), puis se remplit. */
.hand tspan { fill: transparent; stroke: #fff; stroke-width: 2; stroke-dasharray: 700; stroke-dashoffset: 700; transition: stroke-dashoffset .45s linear, fill .35s linear; }
.hand.on tspan { stroke-dashoffset: 0; fill: #fff; }
.hand.neonw tspan { stroke: #39ffb0; } .hand.neonw.on tspan { fill: #39ffb0; }
.hand.neonw.on { filter: drop-shadow(0 0 6px #2ee6a0) drop-shadow(0 0 18px rgba(46,230,160,.8)); }
.arrow.ghost { stroke: none; } .a.drawn .arrow.ghost { marker-end: none; }
@keyframes neon { 0% { opacity:0; } 12% { opacity:1; } 18% { opacity:.15; } 30% { opacity:1; } 36% { opacity:.3; } 50%, 100% { opacity:1; } }
</style>
