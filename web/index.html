<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Zero</title>
<style>
:root{--bg:#0b0f1a;--card:#121a2e;--line:#2c3a5c;--tx:#f2f5fb;--mut:#9fb0d3;--gold:#e0b84f;--ok:#7fe3a5}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--card:#fff;--line:#d5dbea;--tx:#121a2e;--mut:#4b5a7d;--gold:#8a6a10;--ok:#127a44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 Segoe UI,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 50px}header{text-align:center}header img{width:76px}
h1{margin:6px 0 2px;font-size:28px}.tag{color:var(--gold);margin:0 0 16px;font-size:19px;font-weight:600}
.lang{text-align:right;font-size:14px}.lang button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}.lang button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.prog{margin:0 0 14px}.prog p{margin:0 0 6px;color:var(--mut);font-size:15px;text-align:center}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width .35s}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{margin:0 0 14px;font-size:24px;color:var(--gold);line-height:1.3}
button.o{display:block;width:100%;text-align:left;margin:9px 0;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;cursor:pointer}
button.o:hover,button.o:focus-visible{border-color:var(--gold);outline:none}
.res{font-size:20px;line-height:1.45}.res b{color:var(--ok)}.res small{display:block;color:var(--mut);font-size:15px;margin-top:10px}
footer{text-align:center;color:var(--mut);font-size:14px;margin-top:24px}footer a{color:var(--gold)}
</style>
</head>
<body>
<main>
<div class="lang"><button id="en" aria-pressed="true">EN</button> <button id="fr" aria-pressed="false">FR</button></div>
<header><img src="logo.png" alt="CRYPTOR.AGENCY"><h1>Mission Zero</h1><p class="tag" id="tag"></p></header>
<div class="prog"><p id="step"></p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" id="pb"><i id="fill"></i></div></div>
<section id="card" aria-live="polite"></section>
<footer id="foot"></footer>
</main>
<script>
const T = {
  en: {
    tag: 'Are you different? Please vote to see!', step: (n) => 'Question ' + n + ' of 4', done: 'Done, thank you!',
    q: { blocker: 'What blocks AI the most in your company?', stage: 'Where is your company with AI today?', size: 'How big is your company?', proof: 'Would you pay to know if an AI project is worth it, before you start?' },
    o: {
      'data-leak': 'Fear of data leaks', 'no-results': 'Fear of no result', 'data-ready': 'Data not ready', governance: 'Rules and compliance', skills: 'Lack of skills', cost: 'Cost',
      'not-started': 'Not started', testing: 'Testing', 'one-team': 'Used by one team', 'in-production': 'In production everywhere',
      tiny: '1 to 10 people', small: '11 to 250', medium: '251 to 5,000', large: 'More than 5,000',
      yes: 'Yes', maybe: 'Maybe', no: 'No',
    },
    same: 'You are like the studies', diff: 'You are different from the studies', studies: 'The studies point to: ', share: 'You chose: ',
    foot: 'Built for the Meta Global AI Developer Hackathon by <a href="https://cryptor.agency">CRYPTOR.AGENCY</a> · <a href="https://mythozor.com">mythozor.com</a><br>Anonymous: no name, no email, no IP address stored.',
  },
  fr: {
    tag: 'Êtes-vous différent ? Votez pour le savoir !', step: (n) => 'Question ' + n + ' sur 4', done: 'Terminé, merci !',
    q: { blocker: 'Qu’est-ce qui bloque le plus l’IA dans votre entreprise ?', stage: 'Où en est votre entreprise avec l’IA ?', size: 'Quelle est la taille de votre entreprise ?', proof: 'Paieriez-vous pour savoir si un projet d’IA vaut le coup, avant de commencer ?' },
    o: {
      'data-leak': 'Peur des fuites de données', 'no-results': 'Peur de ne pas avoir de résultat', 'data-ready': 'Données pas prêtes', governance: 'Règles et conformité', skills: 'Manque de compétences', cost: 'Coût',
      'not-started': 'Pas commencé', testing: 'On teste', 'one-team': 'Utilisée par une équipe', 'in-production': 'En production partout',
      tiny: '1 à 10 personnes', small: '11 à 250', medium: '251 à 5 000', large: 'Plus de 5 000',
      yes: 'Oui', maybe: 'Peut-être', no: 'Non',
    },
    same: 'Vous êtes comme les études', diff: 'Vous êtes différent des études', studies: 'Les études désignent : ', share: 'Votre choix : ',
    foot: 'Construit pour le hackathon mondial d’IA de Meta par <a href="https://cryptor.agency">CRYPTOR.AGENCY</a> · <a href="https://mythozor.com">mythozor.com</a><br>Anonyme : ni nom, ni e-mail, ni adresse IP conservés.',
  },
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
try { lang = localStorage.getItem('mz-lang') || lang; } catch (e) { /* storage may be blocked */ }
let token = null;
try { token = localStorage.getItem('mz-token'); if (!token) { token = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()) + '-mz'; localStorage.setItem('mz-token', token); } } catch (e) { token = 'anon-' + Math.random().toString(36).slice(2) + Date.now(); }
const $ = (id) => document.getElementById(id);
const post = (p, b) => fetch(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, ...b }) }).then((r) => r.json());
let poll = null, index = 0; const mine = {};
function progress() {
  const t = T[lang]; const n = Math.min(index, 4);
  $('step').textContent = index >= 4 ? t.done : t.step(index + 1);
  $('fill').style.width = (n * 25) + '%'; $('pb').setAttribute('aria-valuenow', n);
}
function show() {
  const t = T[lang]; progress();
  if (!poll) return;
  if (index >= 4) {
    const studies = poll.research.map((id) => t.o[id]).join(' · ');
    const same = poll.research.includes(mine.blocker);
    $('card').innerHTML = '<div class="res"><b>' + (same ? t.same : t.diff) + '</b><br>' + t.share + (t.o[mine.blocker] || '') + '<small>' + t.studies + studies + '</small></div>';
    return;
  }
  const q = poll.questions[index];
  $('card').innerHTML = '<h2>' + t.q[q.id] + '</h2>';
  q.options.forEach((o) => {
    const b = document.createElement('button'); b.className = 'o'; b.type = 'button'; b.textContent = t.o[o];
    b.onclick = async () => { await post('/api/answer', { q: q.id, option: o }); mine[q.id] = o; index += 1; show(); };
    $('card').appendChild(b);
  });
}
function text() {
  const t = T[lang]; document.documentElement.lang = lang; $('tag').textContent = t.tag; $('foot').innerHTML = t.foot;
  $('en').setAttribute('aria-pressed', lang === 'en'); $('fr').setAttribute('aria-pressed', lang === 'fr'); show();
}
function setLang(l) { lang = l; try { localStorage.setItem('mz-lang', l); } catch (e) { /* ignore */ } text(); }
$('en').onclick = () => setLang('en'); $('fr').onclick = () => setLang('fr');
text();
fetch('/api/poll').then((r) => r.json()).then((d) => { poll = d; show(); });
</script>
</body>
</html>
