<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Zero</title>
<style>
:root{--bg:#0b0f1a;--card:#121a2e;--line:#2c3a5c;--tx:#f2f5fb;--mut:#9fb0d3;--gold:#e0b84f;--ok:#7fe3a5}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--card:#fff;--line:#d5dbea;--tx:#121a2e;--mut:#4b5a7d;--gold:#8a6a10;--ok:#127a44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 Segoe UI,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 50px}header{text-align:center}header img{width:84px}
h1{margin:8px 0 2px;font-size:30px}.tag{color:var(--mut);margin:0 0 20px;font-size:16px}
.lang{text-align:right;font-size:14px}.lang button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}.lang button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{margin:0 0 14px;font-size:24px;color:var(--gold);line-height:1.3}
button.o{display:block;width:100%;text-align:left;margin:9px 0;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;cursor:pointer;position:relative;overflow:hidden}
button.o:hover,button.o:focus-visible{border-color:var(--gold);outline:none}button.o.mine{border-color:var(--ok)}
button.o i{position:absolute;inset:0 auto 0 0;background:rgba(224,184,79,.18);width:0;transition:width .4s}button.o span{position:relative}
.res{margin:14px 0 0;padding:12px 14px;border-radius:10px;border:1px solid var(--ok);color:var(--ok);display:none}
footer{text-align:center;color:var(--mut);font-size:14px;margin-top:24px}footer a{color:var(--gold)}
</style>
</head>
<body>
<main>
<div class="lang"><button id="en" aria-pressed="true">EN</button> <button id="fr" aria-pressed="false">FR</button></div>
<header><img src="logo.png" alt="CRYPTOR.AGENCY"><h1>Mission Zero</h1><p class="tag" id="tag"></p></header>
<section aria-labelledby="q1"><h2 id="q1"></h2><div id="opts"></div><p class="res" id="res" role="status"></p></section>
<footer id="foot"></footer>
</main>
<script>
const T = {
  en: {
    tag: 'An AI that finds its own path and shows proof.',
    q1: 'What blocks AI the most in your company?',
    same: (studies) => 'Same as the studies: ' + studies + '.', diff: (studies) => 'Different from the studies, which point to: ' + studies + '.',
    foot: 'Built for the Meta Global AI Developer Hackathon by <a href="https://cryptor.agency">CRYPTOR.AGENCY</a> · <a href="https://mythozor.com">mythozor.com</a><br>Anonymous: no name, no email, no IP address stored.',
    opt: { 'data-leak': 'Fear of data leaks', 'no-results': 'Fear of no result', 'data-ready': 'Data not ready', governance: 'Rules and compliance', skills: 'Lack of skills', cost: 'Cost' },
  },
  fr: {
    tag: 'Une IA qui trouve son chemin et montre ses preuves.',
    q1: 'Qu’est-ce qui bloque le plus l’IA dans votre entreprise ?',
    same: (studies) => 'Comme les études : ' + studies + '.', diff: (studies) => 'Différent des études, qui désignent : ' + studies + '.',
    foot: 'Construit pour le hackathon mondial d’IA de Meta par <a href="https://cryptor.agency">CRYPTOR.AGENCY</a> · <a href="https://mythozor.com">mythozor.com</a><br>Anonyme : ni nom, ni e-mail, ni adresse IP conservés.',
    opt: { 'data-leak': 'Peur des fuites de données', 'no-results': 'Peur de ne pas avoir de résultat', 'data-ready': 'Données pas prêtes', governance: 'Règles et conformité', skills: 'Manque de compétences', cost: 'Coût' },
  },
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
try { lang = localStorage.getItem('mz-lang') || lang; } catch (e) { /* storage may be blocked */ }
let token = null;
try { token = localStorage.getItem('mz-token'); if (!token) { token = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()) + '-mz'; localStorage.setItem('mz-token', token); } } catch (e) { token = 'anon-' + Math.random().toString(36).slice(2) + Date.now(); }
const $ = (id) => document.getElementById(id);
const post = (p, b) => fetch(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, ...b }) }).then((r) => r.json());
let mine = null, poll = null;
function result() {
  if (!mine || !poll) { $('res').style.display = 'none'; return; }
  const t = T[lang]; const studies = poll.research.map((id) => t.opt[id]).join(' · ');
  $('res').textContent = poll.research.includes(mine) ? t.same(studies) : t.diff(studies); $('res').style.display = 'block';
}
function text() {
  const t = T[lang]; document.documentElement.lang = lang;
  $('tag').textContent = t.tag; $('q1').textContent = t.q1; $('foot').innerHTML = t.foot;
  $('en').setAttribute('aria-pressed', lang === 'en'); $('fr').setAttribute('aria-pressed', lang === 'fr');
  if (poll) draw(poll);
}
function draw(d) {
  poll = d; const t = T[lang];
  const total = Object.values(d.counts).reduce((a, b) => a + b, 0) || 1;
  $('opts').innerHTML = '';
  d.options.forEach((o) => {
    const b = document.createElement('button'); b.className = 'o' + (mine === o.id ? ' mine' : ''); b.type = 'button';
    const shown = mine ? ' · ' + d.counts[o.id] : '';
    b.innerHTML = '<i style="width:' + (mine ? Math.round(100 * d.counts[o.id] / total) : 0) + '%"></i><span>' + (t.opt[o.id] || o.label) + shown + '</span>';
    b.onclick = async () => { const r = await post('/api/vote', { option: o.id }); if (r.ok) { mine = o.id; draw({ ...d, counts: r.counts }); } };
    $('opts').appendChild(b);
  });
  result();
}
function setLang(l) { lang = l; try { localStorage.setItem('mz-lang', l); } catch (e) { /* ignore */ } text(); }
$('en').onclick = () => setLang('en'); $('fr').onclick = () => setLang('fr');
text();
fetch('/api/poll').then((r) => r.json()).then(draw);
</script>
</body>
</html>
